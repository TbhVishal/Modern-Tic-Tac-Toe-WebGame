<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tic Tac Toe game with customizable colors and sounds by Vishal Sharma.">
    <meta name="author" content="Vishal Sharma">
    <title>Tic Tac Toe Game</title>
    <link rel="icon" href="assets/images/mainlogo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe Game</h1>
        <div class="color-picker">
            <label for="x-color">X Color: <input type="color" id="x-color" value="#e74c3c"></label>
            <label for="o-color">O Color: <input type="color" id="o-color" value="#3498db"></label>
        </div>
        <div id="status">Player X's Turn</div>
        <div id="board" role="grid" aria-label="Tic Tac Toe Board">
            <div class="cell" data-index="0" role="button" tabindex="0" aria-label="Cell 1, Empty"></div>
            <div class="cell" data-index="1" role="button" tabindex="0" aria-label="Cell 2, Empty"></div>
            <div class="cell" data-index="2" role="button" tabindex="0" aria-label="Cell 3, Empty"></div>
            <div class="cell" data-index="3" role="button" tabindex="0" aria-label="Cell 4, Empty"></div>
            <div class="cell" data-index="4" role="button" tabindex="0" aria-label="Cell 5, Empty"></div>
            <div class="cell" data-index="5" role="button" tabindex="0" aria-label="Cell 6, Empty"></div>
            <div class="cell" data-index="6" role="button" tabindex="0" aria-label="Cell 7, Empty"></div>
            <div class="cell" data-index="7" role="button" tabindex="0" aria-label="Cell 8, Empty"></div>
            <div class="cell" data-index="8" role="button" tabindex="0" aria-label="Cell 9, Empty"></div>
            <div id="win-line" aria-hidden="true"></div>
        </div>
        <div class="buttons">
            <button id="reset" type="button">Reset Game</button>
            <button id="theme-toggle" type="button">Dark Mode</button>
        </div>
    </div>

    <footer>
        Code With ❣️ By Vishal Sharma
        <div class="social-links">
            <a href="https://github.com/tbhvishal" target="_blank" rel="noopener noreferrer" aria-label="Vishal Sharma GitHub Profile">
                <i class="fab fa-github fa-2x"></i>
            </a>
        </div>
    </footer>

    <audio id="move-sound" preload="auto" src="assets/audio/click.mp3"></audio>
    <audio id="win-sound" preload="auto" src="assets/audio/win.mp3"></audio>
    <audio id="draw-sound" preload="auto" src="assets/audio/draw.mp3"></audio>
    <audio id="start-sound" preload="auto" src="assets/audio/start.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
